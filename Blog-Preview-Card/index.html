<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap" rel="stylesheet">

  <!--Tailwind CDN-->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- 3. Override Bootstrap's font variable AFTER Bootstrap's CSS -->
  <style>
    :root {
      --bs-body-font-family: 'Figtree', sans-serif;
    }
  </style>

  <title>Frontend Mentor | Blog preview card</title>

</head>

<body class="bg-[hsl(212,45%,89%)]">

  <main class="d-flex justify-content-center align-items-center min-vh-100 p-6 bg-[hsl(47,88%,63%)]">
    <article class="bg-[hsl(0,0%,100%)] w-[384px] max-w-full  p-6 rounded-[20px] border-[1px] border-solid border-[hsl(0,0%,7%)]
                shadow-[8px_8px_0px_hsl(0,0%,7%)] text-start">

      <!-- Blog illustration -->
      <img src="./assets/images/illustration-article.svg" alt="Illustration Representing HTML AND CSS"
        class="d-block w-100 rounded-[10px] mb-3">

      <!-- Learning label -->
      <p
        class="d-inline-block bg-[hsl(47,88%,63%)] text-[hsl(0,0%,7%)] text-[14px] max-[375px]:text-[12px] font-extrabold px-3 py-1 rounded-1 mb-[12px]">
        Learning</p>

      <!-- Published Date -->
      <p class="text-[14px] mb-[12px]  max-[375px]:text-[12px] fw-medium text-[hsl(0,0%,7%)] leading-[1.5]">Published 21
        Dec 2023</p>

      <!-- Blog heading -->
      <h1 class="text-[24px] max-[375px]:text-[20px] mb-[12px] font-extrabold">
        <a href="https://www.frontendmentor.io/" class="text-[hsl(0,0%,7%)] text-decoration-none transition-colors duration-200 ease-[ease]  hover:text-[hsl(47,88%,63%)]  focus-visible:text-[hsl(47,88%,63%)]
              focus-visible:outline
              focus-visible:outline-2
              focus-visible:outline-[hsl(0,0%,7%)]
              focus-visible:outline-offset-4
              focus-visible:rounded-[2px] motion-reduce:transition-none">
          HTML & CSS foundations
        </a>
      </h1>

      <!-- Description -->
      <p class="text-[16px] fw-medium leading-[1.5] max-[375px]:text-[14px] text-[hsl(0,0%,42%)] mb-[12px]">
        These languages are the backbone of every
        website, defining structure, content, and
        presentation.
      </p>
      <!-- Author information -->
      <div class="d-flex align-items-center gap-[12px]">
        <img src="assets/images/image-avatar.webp" class="w-[32px] h-[32px]" alt="Greg Hooper image">
        <p class="text-center">Greg Hooper</p>
      </div>
    </article>

  </main>

</body>

</html>
