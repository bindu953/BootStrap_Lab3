<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="./images/favicon-32x32.png">

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

  <!--Tailwind CDN-->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- 3. Override Bootstrap's font variable AFTER Bootstrap's CSS -->
  <style>
    :root {
      --bs-body-font-family: 'Outfit', sans-serif;
    }
  </style>
  <title>Frontend Mentor | QR code component</title>

</head>

<body class="bg-[hsl(212,45%,89%)]">

  <main class="d-flex justify-content-center align-items-center min-vh-100 p-6 max-[375px]:p-4">
    <!-- <main> -->

    <section
      class="d-flex flex-column justify-content-center align-items-center p-3 bg-white w-[320px] mw-100 rounded-[20px]">

      <!-- QR code image -->
      <img src="./images/image-qr-code.png" alt="QR code to visit Frontend Mentor"
        class="d-block w-100 rounded-[10px]">

      <!-- Text container -->
      <div class="py-4 px-3">

        <!-- Heading -->
        <h1 class="text-[22px] fw-bold text-[hsl(218,44%,22%)] mb-3 leading-[1.2]">
          Improve your front-end skills by building projects
        </h1>

        <!-- Description -->
        <p class="text-[15px] text-[hsl(216,15%,48%)] fw-normal leading-[1.2]">
          Scan the QR code to visit Frontend Mentor
          and take your coding skills
          to the next level
        </p>

      </div>

    </section>

  </main>

</body>

</html>
